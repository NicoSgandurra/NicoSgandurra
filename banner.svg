<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Nicolas Sgandurra. Electricidad, simulación y software.">
  <defs>
    <radialGradient id="brillo" cx="22%" cy="0%" r="70%">
      <stop offset="0" stop-color="#4ade9b" stop-opacity=".26"/>
      <stop offset="1" stop-color="#4ade9b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brillo2" cx="88%" cy="100%" r="55%">
      <stop offset="0" stop-color="#7cb4ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#7cb4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puntos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="nombre" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".35" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a3a5ac"/>
    </linearGradient>
    <linearGradient id="filo" x1="0" x2="1">
      <stop offset="0" stop-color="#4ade9b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4ade9b" stop-opacity=".8"/>
      <stop offset="1" stop-color="#4ade9b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="borde"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#borde)">
    <rect width="1280" height="320" fill="#07080a"/>
    <rect width="1280" height="320" fill="url(#puntos)"/>
    <rect width="1280" height="320" fill="url(#brillo)"/>
    <rect width="1280" height="320" fill="url(#brillo2)"/>

    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="72" y="70" width="136" height="28" rx="14" fill="#4ade9b" fill-opacity=".12"/>
      <circle cx="90" cy="84" r="4" fill="#4ade9b"/>
      <text x="102" y="89" font-size="14" font-weight="600" fill="#4ade9b">San Rafael, AR</text>
      <text x="70" y="172" font-size="66" font-weight="700" letter-spacing="-2.6" fill="url(#nombre)">Nicolas Sgandurra</text>
      <text x="72" y="214" font-size="21" fill="#a1a3aa">Técnico electricista, docente y estudiante de Ingeniería Electromecánica</text>
      <g font-size="14" font-family="'JetBrains Mono', Consolas, monospace" fill="#a1a3aa">
        <rect x="72" y="238" width="128" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
        <text x="136" y="258" text-anchor="middle">simuladores</text>
        <rect x="210" y="238" width="168" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
        <text x="294" y="258" text-anchor="middle">software a medida</text>
        <rect x="388" y="238" width="118" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
        <text x="447" y="258" text-anchor="middle">sitios web</text>
      </g>
    </g>

    <g transform="translate(860 52)">
      <rect width="348" height="216" rx="16" fill="#0d0e10" stroke="#ffffff" stroke-opacity=".14"/>
      <rect x="70" y="-1" width="208" height="1.5" fill="url(#filo)"/>
      <g fill="#ffffff" fill-opacity=".12"><circle cx="20" cy="20" r="5"/><circle cx="36" cy="20" r="5"/><circle cx="52" cy="20" r="5"/></g>
      <line x1="0" y1="40" x2="348" y2="40" stroke="#ffffff" stroke-opacity=".08"/>
      <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
        <rect x="10" y="50" width="328" height="44" rx="10" fill="#ffffff" fill-opacity=".06"/>
        <rect x="20" y="58" width="28" height="28" rx="8" fill="#34c589" fill-opacity=".16" stroke="#34c589" stroke-opacity=".35"/>
        <path d="M24 73h4l2-5 4 10 3-12 2 7h5" fill="none" stroke="#34c589" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="60" y="70" fill="#ededef" font-weight="600">Nexxo</text>
        <text x="60" y="85" fill="#7f828a" font-size="11.5">Gestión comercial a medida</text>
        <rect x="20" y="108" width="28" height="28" rx="8" fill="#4ade9b" fill-opacity=".12" stroke="#4ade9b" stroke-opacity=".3"/>
        <path d="M25 122c3-7 6-7 9 0s6 7 9 0" fill="none" stroke="#4ade9b" stroke-width="1.8" stroke-linecap="round"/>
        <text x="60" y="120" fill="#a1a3aa" font-weight="500">Simuladores eléctricos</text>
        <text x="60" y="135" fill="#7f828a" font-size="11.5">Circuitos en el navegador</text>
        <rect x="20" y="152" width="28" height="28" rx="8" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".3"/>
        <g stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"><line x1="26" y1="161" x2="42" y2="161"/><line x1="26" y1="166" x2="42" y2="166"/><line x1="26" y1="171" x2="42" y2="171"/></g>
        <text x="60" y="164" fill="#a1a3aa" font-weight="500">Intercambiador de calor</text>
        <text x="60" y="179" fill="#7f828a" font-size="11.5">Ocho simuladores en Python</text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="319" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
